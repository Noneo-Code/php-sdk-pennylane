stages:
  - test
  - integration
  - veille

.php_setup:
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress

phpunit:
  extends: .php_setup
  stage: test
  before_script:
    - apt-get update && apt-get install -y unzip git
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
  script:
    - composer test -- --coverage-text --coverage-cobertura=coverage.xml
  coverage: '/^\s*Lines:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

phpstan:
  extends: .php_setup
  stage: test
  script:
    - composer stan

cs-fixer:
  extends: .php_setup
  stage: test
  script:
    - composer cs

endpoint-coverage:
  extends: .php_setup
  stage: test
  script:
    - php bin/coverage.php

# `coverage.php` valide les chemins, celui-ci valide les formes : chaque
# fixture recopiée à la main et chaque enum backed est confronté au schéma
# OpenAPI dont il se réclame. Bloquant : un écart se corrige, ou s'assume dans
# la liste d'exclusions du script.
schema-check:
  extends: .php_setup
  stage: test
  script:
    - php bin/schema-check.php

# Tests contre l'API réelle. Jamais dans un pipeline de MR : `when: manual` et
# `allow_failure` pour qu'un déclenchement volontaire ne bloque pas la branche,
# l'API pouvant être indisponible sans que le SDK y soit pour quelque chose.
#
# `PENNYLANE_API_TOKEN` se définit dans CI/CD > Variables, **masquée et
# protégée**, avec le jeton d'un compte de bac à sable — jamais un jeton de
# production. Sans elle, la suite s'ignore proprement plutôt que d'échouer.
# `PENNYLANE_SANDBOX` vaut `1` uniquement si l'on accepte que le job crée des
# objets impossibles à supprimer ensuite.
integration:
  extends: .php_setup
  stage: integration
  rules:
    - when: manual
  allow_failure: true
  script:
    - composer test:integration

# Veille hebdomadaire des specs Pennylane. Le schedule qui la déclenche se crée
# à la main dans CI/CD > Schedules ; `SPEC_WATCH_FORCE` permet de rejouer le job
# sur n'importe quel pipeline sans toucher à ces règles.
spec-watch:
  extends: .php_setup
  stage: veille
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $SPEC_WATCH_FORCE
  script:
    - php bin/spec-watch.php

no-framework:
  extends: .php_setup
  stage: test
  script:
    - |
      if php -r '
        $packages = json_decode(file_get_contents("composer.lock"), true)["packages"] ?? [];
        $packages = array_merge($packages, json_decode(file_get_contents("composer.lock"), true)["packages-dev"] ?? []);
        foreach ($packages as $package) {
            if (preg_match("#^(illuminate|laravel)/#", $package["name"])) {
                fwrite(STDERR, "Dépendance framework détectée : {$package["name"]}\n");
                exit(1);
            }
        }
        exit(0);
      '; then
        echo "Aucune dépendance illuminate/* ou laravel/* détectée."
      else
        exit 1
      fi
