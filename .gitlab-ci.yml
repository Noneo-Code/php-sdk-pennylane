stages:
  - test
  - veille

.php_setup:
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y unzip git
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress

phpunit:
  extends: .php_setup
  stage: test
  before_script:
    - apt-get update && apt-get install -y unzip git
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
  script:
    - composer test -- --coverage-text --coverage-cobertura=coverage.xml
  coverage: '/^\s*Lines:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

phpstan:
  extends: .php_setup
  stage: test
  script:
    - composer stan

cs-fixer:
  extends: .php_setup
  stage: test
  script:
    - composer cs

endpoint-coverage:
  extends: .php_setup
  stage: test
  script:
    - php bin/coverage.php

# Veille hebdomadaire des specs Pennylane. Le schedule qui la déclenche se crée
# à la main dans CI/CD > Schedules ; `SPEC_WATCH_FORCE` permet de rejouer le job
# sur n'importe quel pipeline sans toucher à ces règles.
spec-watch:
  extends: .php_setup
  stage: veille
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $SPEC_WATCH_FORCE
  script:
    - php bin/spec-watch.php

no-framework:
  extends: .php_setup
  stage: test
  script:
    - |
      if php -r '
        $packages = json_decode(file_get_contents("composer.lock"), true)["packages"] ?? [];
        $packages = array_merge($packages, json_decode(file_get_contents("composer.lock"), true)["packages-dev"] ?? []);
        foreach ($packages as $package) {
            if (preg_match("#^(illuminate|laravel)/#", $package["name"])) {
                fwrite(STDERR, "Dépendance framework détectée : {$package["name"]}\n");
                exit(1);
            }
        }
        exit(0);
      '; then
        echo "Aucune dépendance illuminate/* ou laravel/* détectée."
      else
        exit 1
      fi
